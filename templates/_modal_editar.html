<div class="modal-overlay" id="modal-editar">
  <div class="modal" style="width:720px">
    <div class="modal-title">✏ Editar Póliza</div>
    <form method="POST" action="" id="form-editar">
      <input type="hidden" name="id" id="e-id">
      <div class="form-grid">
        <div class="form-group full" style="background:var(--surface2);border-radius:8px;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
          <div class="form-group">
            <label>Aseguradora *</label>
            <select name="aseguradora" id="e-aseguradora" required>
              <option>NRE</option><option>ATM</option>
            </select>
          </div>
          <div class="form-group">
            <label>Modalidad *</label>
            <select name="modalidad" id="e-modalidad">
              <option value="trimestral_unico">Trimestral — Pago único</option>
              <option value="trimestral_mensual">Trimestral — Pago mensual</option>
              <option value="bimestral_unico">Bimestral — Pago único</option>
            </select>
          </div>
          <div class="form-group">
            <label>Forma de Pago</label>
            <select name="forma_pago" id="e-forma_pago">
              <option>Efectivo</option><option>Transferencia</option>
              <option>Tarjeta Débito</option><option>Tarjeta Crédito</option><option>Cheque</option>
            </select>
          </div>
        </div>

        <div class="form-group full" style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px">
          <label style="font-size:12px;color:var(--accent)">DATOS DEL ASEGURADO</label>
        </div>
        <div class="form-group"><label>Nombre completo *</label><input name="nombre" id="e-nombre" required></div>
        <div class="form-group"><label>DNI / CUIT</label><input name="dni" id="e-dni"></div>
        <div class="form-group"><label>Celular</label><input name="celular" id="e-celular" placeholder="381-xxx-xxxx"></div>
        <div class="form-group"><label>Domicilio</label><input name="domicilio" id="e-domicilio"></div>
        <div class="form-group"><label>CP</label><input name="cp" id="e-cp"></div>
        <div class="form-group"><label>Localidad</label><input name="localidad" id="e-localidad"></div>
        <div class="form-group"><label>Provincia</label><input name="provincia" id="e-provincia"></div>
        <div class="form-group"><label>Cond. IVA</label>
          <select name="cond_iva" id="e-cond_iva">
            <option>CONSUMIDOR FINAL</option><option>RESPONSABLE INSCRIPTO</option>
            <option>MONOTRIBUTISTA</option><option>EXENTO</option>
          </select>
        </div>

        <div class="form-group full" style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px">
          <label style="font-size:12px;color:var(--accent)">DATOS DEL VEHÍCULO</label>
        </div>
        <div class="form-group"><label>Marca</label><input name="marca" id="e-marca"></div>
        <div class="form-group"><label>Modelo</label><input name="modelo" id="e-modelo"></div>
        <div class="form-group"><label>Año</label><input name="anio" id="e-anio"></div>
        <div class="form-group"><label>Patente</label><input name="patente" id="e-patente" style="text-transform:uppercase"></div>
        <div class="form-group"><label>Motor</label><input name="motor" id="e-motor"></div>
        <div class="form-group"><label>Chasis</label><input name="chasis" id="e-chasis"></div>
        <div class="form-group"><label>Tipo de Vehículo</label>
          <select name="tipo_vehiculo" id="e-tipo_vehiculo">
            <option>Automovil Nacional</option><option>Automovil Importado</option>
            <option>PICK UP Y JEEP</option><option>Camioneta</option><option>Moto</option>
          </select>
        </div>
        <div class="form-group"><label>Carrocería</label>
          <select name="carroceria" id="e-carroceria">
            <option>Sedan</option><option>Hatchback</option><option>SUV</option>
            <option>PICK-UP</option><option>Coupe</option><option>Rural</option>
          </select>
        </div>
        <div class="form-group"><label>Uso</label>
          <select name="uso" id="e-uso">
            <option>PARTICULAR</option><option>TAXI</option><option>REMIS</option><option>COMERCIAL</option>
          </select>
        </div>
        <div class="form-group"><label>Origen</label>
          <select name="origen" id="e-origen">
            <option>Nacional</option><option>Importado</option>
          </select>
        </div>

        <div class="form-group full" style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px">
          <label style="font-size:12px;color:var(--accent)">VIGENCIA Y MONTOS</label>
        </div>
        <div class="form-group"><label>Fecha inicio</label><input type="date" name="fecha_inicio" id="e-fecha_inicio"></div>
        <div class="form-group"><label>Fecha vencimiento</label><input type="date" name="fecha_venc" id="e-fecha_venc"></div>
        <div class="form-group"><label>Prima ($)</label><input type="number" step="0.01" name="prima" id="e-prima"></div>
        <div class="form-group"><label>Rec. Financiero ($)</label><input type="number" step="0.01" name="rec_financiero" id="e-rec_financiero"></div>
        <div class="form-group"><label>IVA ($)</label><input type="number" step="0.01" name="iva" id="e-iva"></div>
        <div class="form-group"><label>Otros Imp. ($)</label><input type="number" step="0.01" name="otros_impuestos" id="e-otros_impuestos"></div>
        <div class="form-group"><label>Premio / Total ($)</label><input type="number" step="0.01" name="premio" id="e-premio"></div>
        <div class="form-group full"><label>Observaciones</label>
          <textarea name="obs" id="e-obs" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal('editar')">Cancelar</button>
        <button type="submit" class="btn btn-primary">💾 Guardar Cambios</button>
      </div>
    </form>
  </div>
</div>
